<!DOCTYPE html>

<html lang="en">
  <head>
    <title>Nefily App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-attachment: scroll;
        display: flex;
      }

      .main-container {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh; /*This ensures that all height is taken: no white space*/
        min-height: 780px;
        height: auto; /*Height grows as more products are added*/
        border: 1px solid rgb(173, 173, 173);
        border-radius: 10px;
        display: flex;
      }

      .top-container {
        width: 100%;
        height: 85px;
        display: flex;
      }

      .top-left-div {
        width: 75px;
        height: 85px;
        border-right: 1px solid rgb(183, 183, 183);
        border-bottom: 1px solid rgb(156, 156, 156);
      }

      .logo-image {
        margin-top: 25px;
        margin-left: 20px;
      }

      .top-right-div {
        flex: 1;
        height: 85px;
        border-bottom: 1px solid rgb(156, 156, 156);
      }

      .top-right-div-para {
        font-size: 28px;
        padding-top: 25px;
        padding-left: 20px;
        font-weight: bold;
        font-family: Arial;
      }

      .bottom-container {
        width: 100%;
        flex: 1;
        display: flex;
      }

      .bottom-left-div {
        width: 75px;
        border-right: 1px solid rgb(183, 183, 183);
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        display: flex;
      }

      .mainMenu-image {
        margin-top: 15px;
      }

      .contaierOfAvatarAndSettings {
        width: 40px;
        height: 100px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: space-between;
        margin-top: 5px;
      }

      .bottom-right-div {
        flex: 1; /*This is for width. No need to give flex: 1; to height as .bottom-container is already does it*/
        flex-direction: column;
        display: flex;
      }

      .bottom-right-upper-div {
        height: 90px;
        border-bottom: 1px solid red;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .bottom-right-top-searching-div {
        width: 300px;
        height: 45px;
        border: 1px solid rgb(163, 163, 163);
        border-radius: 5px;
        margin-left: 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      
      .input-element {
        font-size: 18px;
        border: none; 
        margin-left: 7px;
      }
      .input-element:focus {
        outline: none;
      }

      .bottom-right-top-right-div {
        display: flex;
        width: 350px; 
        height: 90px; 
        flex-direction: row; 
        align-items: center;
        justify-content: space-between;
      }

      .total-orders-div {
        width: 175px;
        height: 45px;
        border: 1px solid rgb(207, 207, 207);
        border-radius: 10px;
        margin-left: 13px;
        align-items: center;
        display: flex;
      }

      .time-div {
        width: 120px;
        height: 45px;
        border: 1px solid rgb(207, 207, 207);
        border-radius: 10px;
        margin-right: 20px;
        align-items: center;
        display: flex;
      }

      .bottom-right-lower-div {
        flex: 1;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        position: relative;
        overflow: hidden; /* Ensures no content overflows */
        
      }

      .products-container-1 {
        margin-top: 17px;
        margin-left: 17px;
        margin-right: 10px;
        margin-bottom: 17px;
        width: 370px;
        height: 2220px;
        transition: 0.5s ease-in-out;
      }
      .products-container-1:hover {
        transform: scale(1.04, 1.015);  /* Width increases 10%, Height increases 30% */
      }
      .products-container-1-head {
        display: flex;
        width: 368px;
        height: 60px;
        background-color: rgb(14, 115, 246);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .products-container-1-body {
        width: 368px;
        height: 2160px;
        background-color: rgb(245, 245, 245);
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
      }

      .products-container-2 {
        margin-top: 17px;
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 17px;
        width: 370px;
        transition: 0.5s ease-in-out;
      }
      .products-container-2:hover {
        transform: scale(1.04, 1.015);  /* Width increases 10%, Height increases 30% */
      }
      .products-container-2-head {
        display: flex;
        width: 368px;
        height: 60px;
        background-color: rgb(248, 197, 27);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .products-container-2-body {
        width: 368px;
        height: 886px;
        background-color: rgb(245, 245, 245);
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
      }
      

      .products-container-3 {
        margin-top: 17px;
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 17px;
        width: 370px;
        transition: 0.5s ease-in-out;
      }
      .products-container-3:hover {
        transform: scale(1.04, 1.015);  /* Width increases 10%, Height increases 30% */
      }
      .products-container-3-head {
        display: flex;
        width: 368px;
        height: 60px;
        background-color: rgb(34, 195, 72);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .products-container-3-body {
        width: 368px;
        height: 1030px;
        background-color: rgb(245, 245, 245);
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
      }

      .products-container-4 {
        margin-top: 17px;
        margin-left: 10px;
        margin-right: 17px;
        margin-bottom: 17px;
        width: 370px;
        transition: 0.5s ease-in-out;
      }
      .products-container-4:hover {
        transform: scale(1.04, 1.015);  /* Width increases 10%, Height increases 30% */
      }
      .products-container-4-head {
        display: flex;
        width: 368px;
        height: 60px;
        background-color: rgb(26, 193, 157);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .products-container-4-body {
        width: 368px;
        height: 370px;
        background-color: rgb(245, 245, 245);
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="main-container">
      <div class="top-container">
        <div class="top-left-div">
          <img src="/nefilyApp/images/logoOfProject.png" class="logo-image">
        </div>
        <div class="top-right-div">
          <p class="top-right-div-para">Today's Orders</p>
        </div>
      </div>
     
      <div class="bottom-container">
        <div class="bottom-left-div">
          <img src="/nefilyApp/images/main_menuOfProject.png" class="mainMenu-image">

          <div class="contaierOfAvatarAndSettings">
            <img src="/nefilyApp/images/settingsOfProject.jpg"  style="width: 29px; height: 29x;">
            <hr style="width: 34px; border: 1px solid rgb(167, 167, 167);">
            <img src="/nefilyApp/images/avatarOfProject.png">
          </div>
        </div>

        <div class="bottom-right-div">
          <div class="bottom-right-upper-div">
            <div class="bottom-right-top-searching-div">
              <img src="/nefilyApp/images/searchingIcon.png" style="width: 25px; height: 25px; margin-left: 17px;">
              <input placeholder="Search with id" class="input-element">
            </div>

            <div class="bottom-right-top-right-div">
              <div class="total-orders-div">
                <img src="/nefilyApp/images/checkmark1.webp" style="width: 35px; height: 35px; margin-left: 15px;">
                <p style="display: inline-block; font-size: 20px; margin-left: 2px;">All: 
                  <select style="font-size: 19px; border: none;">
                    <option selected value="63" style="border: none;">63</option>
                    <option value="1">1</option>
                  </select>
                </p>
              </div>
              <div class="time-div" >
                <img src="/nefilyApp/images/clock-timer-icon.png" style="width: 26px; height: 26px; margin-left: 15px;">
                <p style="font-size: 21px; margin-left: 15px;">45:08</p>
              </div>
            </div>
          </div>   
          
          <div class="bottom-right-lower-div">
            <div class="products-container-1">
              <div class="products-container-1-head">
                <p style="font-size: 25px; margin: 15px; color: white; font-family: Arial;">New (5)</p>
              </div>
              <div class="products-container-1-body"></div>
            </div>

            <div class="products-container-2">
              <div class="products-container-2-head">
                <p style="font-size: 25px; margin: 15px; color: white; font-family: Arial;">Blank (3)</p>
              </div>
              <div class="products-container-2-body"></div>
            </div>

            <div class="products-container-3">
              <div class="products-container-3-head">
                <p style="font-size: 25px; margin: 15px; color: white; font-family: Arial;">Ready (4)</p>
              </div>
              <div class="products-container-3-body"></div>
            </div>

            <div class="products-container-4">
              <div class="products-container-4-head">
                <p style="font-size: 25px; margin: 15px; color: white; font-family: Arial;">Courier on the way (1)</p>
              </div>
              <div class="products-container-4-body"></div>
            </div>
          </div>
        </div>
      </div>   
    </div>
  </body>
</html>
